<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none" role="img" aria-label="IT networking and connectivity illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2d6cc9"/>
      <stop offset="1" stop-color="#2057a8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dcb22b"/>
      <stop offset="1" stop-color="#c9950c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2057a8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="720" height="520" rx="24" fill="url(#bg)"/>

  <!-- circuit lines -->
  <g stroke="#2d6cc9" stroke-opacity="0.14" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 120 H180 L200 100 L220 120 H320"/>
    <path d="M400 400 H500 L520 380 L540 400 H640"/>
    <path d="M120 380 V280 L140 260 L160 280 V180"/>
    <path d="M560 140 V240 L540 260 L520 240 V340"/>
  </g>
  <g fill="#2d6cc9" fill-opacity="0.35">
    <circle cx="180" cy="120" r="4"/>
    <circle cx="320" cy="120" r="4"/>
    <circle cx="500" cy="400" r="4"/>
    <circle cx="140" cy="260" r="4"/>
    <circle cx="540" cy="260" r="4"/>
  </g>

  <!-- central hub -->
  <g filter="url(#softShadow)">
    <circle cx="360" cy="250" r="88" fill="white"/>
    <circle cx="360" cy="250" r="72" fill="url(#blueGrad)" fill-opacity="0.08"/>
    <circle cx="360" cy="250" r="56" stroke="url(#blueGrad)" stroke-width="3"/>
    <!-- wave mark -->
    <path d="M318 250 C318 222, 338 210, 350 228 C350 210, 370 210, 370 228 C382 210, 402 222, 402 250 C402 278, 382 290, 370 272 C370 290, 350 290, 350 272 C338 290, 318 278, 318 250Z" fill="url(#blueGrad)"/>
  </g>

  <!-- connection spokes -->
  <g stroke="#2d6cc9" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="6 8">
    <line x1="360" y1="194" x2="360" y2="118"/>
    <line x1="416" y1="222" x2="498" y2="168"/>
    <line x1="416" y1="278" x2="498" y2="332"/>
    <line x1="360" y1="306" x2="360" y2="382"/>
    <line x1="304" y1="278" x2="222" y2="332"/>
    <line x1="304" y1="222" x2="222" y2="168"/>
  </g>

  <!-- server rack -->
  <g transform="translate(118 148)" filter="url(#softShadow)">
    <rect width="96" height="132" rx="12" fill="white"/>
    <rect x="12" y="16" width="72" height="18" rx="4" fill="#e2e8f0"/>
    <rect x="12" y="42" width="72" height="18" rx="4" fill="#e2e8f0"/>
    <rect x="12" y="68" width="72" height="18" rx="4" fill="#e2e8f0"/>
    <rect x="12" y="94" width="72" height="18" rx="4" fill="url(#blueGrad)" fill-opacity="0.85"/>
    <circle cx="20" cy="25" r="3" fill="#22c55e"/>
    <circle cx="20" cy="51" r="3" fill="#22c55e"/>
    <circle cx="20" cy="77" r="3" fill="#22c55e"/>
    <circle cx="20" cy="103" r="3" fill="#c9950c"/>
    <rect x="52" y="22" width="24" height="2" rx="1" fill="#94a3b8"/>
    <rect x="52" y="48" width="24" height="2" rx="1" fill="#94a3b8"/>
    <rect x="52" y="74" width="24" height="2" rx="1" fill="#94a3b8"/>
  </g>

  <!-- wifi node -->
  <g transform="translate(500 108)" filter="url(#softShadow)">
    <rect width="88" height="88" rx="16" fill="white"/>
    <path d="M44 58 C32 58, 24 50, 24 38" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 50 C36 50, 30 44, 30 36" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round"/>
    <path d="M44 42 C40 42, 36 38, 36 34" stroke="url(#blueGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="44" cy="60" r="4" fill="url(#goldGrad)"/>
  </g>

  <!-- cctv node -->
  <g transform="translate(500 292)" filter="url(#softShadow)">
    <rect width="88" height="88" rx="16" fill="white"/>
    <rect x="22" y="34" width="44" height="28" rx="8" fill="url(#blueGrad)"/>
    <circle cx="44" cy="48" r="10" fill="white" fill-opacity="0.9"/>
    <circle cx="44" cy="48" r="5" fill="url(#blueGrad)"/>
    <path d="M66 42 L74 38 V58 L66 54Z" fill="#64748b"/>
    <rect x="30" y="66" width="28" height="6" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- phone / voip -->
  <g transform="translate(118 312)" filter="url(#softShadow)">
    <rect width="96" height="88" rx="16" fill="white"/>
    <rect x="24" y="20" width="48" height="48" rx="10" fill="url(#blueGrad)" fill-opacity="0.12"/>
    <path d="M34 34 C34 30, 38 28, 42 30 L48 34 C50 35, 51 38, 50 40 L47 46 C46 48, 47 51, 49 53 C54 58, 60 62, 66 58 L70 55 C72 54, 75 54, 76 56 L80 62 C81 64, 81 67, 79 69 C74 74, 66 76, 58 72 C48 66, 40 58, 34 48 C30 42, 30 36, 34 34Z" fill="url(#goldGrad)"/>
  </g>

  <!-- building -->
  <g transform="translate(286 354)" filter="url(#softShadow)">
    <rect width="148" height="108" rx="14" fill="white"/>
    <rect x="18" y="24" width="44" height="68" rx="6" fill="#e2e8f0"/>
    <rect x="72" y="34" width="58" height="58" rx="6" fill="url(#blueGrad)" fill-opacity="0.12"/>
    <rect x="26" y="34" width="12" height="12" rx="2" fill="url(#blueGrad)" fill-opacity="0.35"/>
    <rect x="42" y="34" width="12" height="12" rx="2" fill="url(#blueGrad)" fill-opacity="0.35"/>
    <rect x="26" y="52" width="12" height="12" rx="2" fill="url(#blueGrad)" fill-opacity="0.35"/>
    <rect x="42" y="52" width="12" height="12" rx="2" fill="url(#blueGrad)" fill-opacity="0.35"/>
    <rect x="26" y="70" width="12" height="12" rx="2" fill="url(#goldGrad)" fill-opacity="0.55"/>
    <rect x="42" y="70" width="12" height="12" rx="2" fill="url(#blueGrad)" fill-opacity="0.35"/>
    <rect x="84" y="48" width="34" height="4" rx="2" fill="#94a3b8"/>
    <rect x="84" y="58" width="28" height="4" rx="2" fill="#94a3b8"/>
    <rect x="84" y="68" width="32" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- access badge -->
  <g transform="translate(286 108)" filter="url(#softShadow)">
    <rect width="108" height="72" rx="14" fill="white"/>
    <rect x="16" y="16" width="28" height="40" rx="6" fill="url(#goldGrad)" fill-opacity="0.15"/>
    <circle cx="30" cy="28" r="8" fill="url(#blueGrad)"/>
    <rect x="52" y="22" width="40" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="52" y="34" width="32" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="52" y="46" width="36" height="6" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- floating status chips -->
  <g>
    <rect x="548" y="404" width="118" height="34" rx="17" fill="white" filter="url(#softShadow)"/>
    <circle cx="566" cy="421" r="6" fill="#22c55e"/>
    <text x="580" y="425" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d6cc9">Network Online</text>
  </g>
  <g>
    <rect x="54" y="404" width="132" height="34" rx="17" fill="white" filter="url(#softShadow)"/>
    <circle cx="72" cy="421" r="6" fill="url(#goldGrad)"/>
    <text x="86" y="425" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d6cc9">Secure Access</text>
  </g>
</svg>
